<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portofolio Zhogi Achmad Panusunan">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portofolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>portofolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading -->
  <style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #1a1a1a;
    }

    .loader {
        display: flex;
        gap: 8px;
        filter: drop-shadow(0 0 12px rgba(0, 255, 150, 0.5));
    }

    .dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #00ff96;
        animation: bounce 1.4s infinite cubic-bezier(0.39, 0.21, 0.4, 0.87);
    }

    .dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
            opacity: 0.4;
        }
        50% {
            transform: translateY(-30px);
            opacity: 1;
        }
    }

    /* Optional: Tambahkan teks "Loading" */
    .loading-text {
        position: fixed;
        bottom: 40%;
        color: #00ff96;
        font-family: Arial, sans-serif;
        letter-spacing: 2px;
        opacity: 0.8;
    }
</style>
</head>
<body>
  <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
  </div>
  <div id="loading_indicator" class="loading-text">LOADING...</div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.onload = function () {
      setTimeout(function () {
        var loadingIndicator = document.getElementById("loading_indicator");
        if (loadingIndicator) {
          loadingIndicator.remove();
        }
      }, 10000);
    };
</script>
</body>
</html>
